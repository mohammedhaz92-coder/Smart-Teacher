<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدرجات والتقييم - منصة بذرة</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #34495e; --accent-color: #3498db; --bg-color: #f4f7f6; --card-bg: #ffffff; --success-color: #27ae60; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding: 70px 15px 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100dvh; box-sizing: border-box; }
        
        .back-btn-fixed { position: fixed; top: 15px; right: 15px; z-index: 9999; background-color: var(--primary-color); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-btn-fixed:hover { background-color: #1a252f; transform: scale(1.05); }
        
        .page-container { width: 100%; max-width: 1000px; background-color: var(--card-bg); border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 25px; box-sizing: border-box; }
        .page-title { text-align: center; color: var(--primary-color); margin: 0 0 20px 0; font-size: 1.8rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; white-space: nowrap; }
        tr:hover { background-color: #f1f2f6; }
        .grade-input { width: 60px; padding: 8px 5px; text-align: center; border: 1px solid #ccc; border-radius: 5px; font-family: 'Tajawal', sans-serif; outline: none; }
        .grade-input:focus { border-color: var(--accent-color); }
        
        .btn-save { background-color: var(--success-color); color: white; border: none; padding: 15px 20px; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; font-size: 1.1rem; width: 100%; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-save:hover { background-color: #219653; }
        
        @media (max-width: 600px) { body { padding-top: 65px; } th, td { padding: 6px; font-size: 0.85rem; } .grade-input { width: 45px; padding: 5px; } }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn-fixed"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    
    <div class="page-container">
        <h2 class="page-title"><i class="fa-solid fa-star"></i> الدرجات والتقييم (السحابي)</h2>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: right;">اسم التلميذ</th>
                        <th>الصف والشعبة</th>
                        <th>الشهر 1</th>
                        <th>الشهر 2</th>
                        <th>نصف السنة</th>
                        <th>السعي</th>
                    </tr>
                </thead>
                <tbody id="gradesList">
                    <tr><td colspan="6" style="text-align: center;">جاري جلب بيانات التلاميذ والدرجات من السحابة...</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-save" onclick="saveAllGrades()"><i class="fa-solid fa-floppy-disk"></i> حفظ جميع الدرجات سحابياً</button>
    </div>

    <script type="module">
        import { 
            collection, 
            getDocs, 
            setDoc, 
            doc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        async function initGradesPage() {
            if (!window.db) {
                setTimeout(initGradesPage, 500);
                return;
            }

            const db = window.db;
            const gradesTable = document.getElementById('gradesList');

            // مراقبة بيانات التلاميذ والدرجات لحظياً
            onSnapshot(collection(db, "students"), async (studentSnapshot) => {
                if (studentSnapshot.empty) {
                    gradesTable.innerHTML = '<tr><td colspan="6" style="text-align: center;">لا يوجد تلاميذ. يرجى إضافتهم من صفحة (سجل التلاميذ) أولاً.</td></tr>';
                    return;
                }

                // جلب الدرجات المخزنة مسبقاً من مجموعة منفصلة 'grades' في السحابة
                const gradesSnapshot = await getDocs(collection(db, "grades"));
                const gradesMap = {};
                gradesSnapshot.forEach(docSnap => {
                    gradesMap[docSnap.id] = docSnap.data();
                });

                gradesTable.innerHTML = '';

                studentSnapshot.forEach((stdDoc) => {
                    const std = stdDoc.data();
                    const stdId = stdDoc.id;
                    const stdGrades = gradesMap[stdId] || { m1: '', m2: '', mid: '' };

                    // حساب المعدل (السعي) تلقائياً
                    let total = 0, count = 0;
                    if(stdGrades.m1 !== '') { total += Number(stdGrades.m1); count++; }
                    if(stdGrades.m2 !== '') { total += Number(stdGrades.m2); count++; }
                    if(stdGrades.mid !== '') { total += Number(stdGrades.mid); count++; }
                    let avg = count > 0 ? Math.round(total / count) : '-';

                    gradesTable.innerHTML += `<tr>
                        <td style="text-align: right; font-weight: bold;">${std.name}</td>
                        <td style="color: #666; font-size: 0.9rem;">${std.classRoom || 'غير محدد'}</td>
                        <td><input type="number" class="grade-input m1" data-id="${stdId}" value="${stdGrades.m1}"></td>
                        <td><input type="number" class="grade-input m2" data-id="${stdId}" value="${stdGrades.m2}"></td>
                        <td><input type="number" class="grade-input mid" data-id="${stdId}" value="${stdGrades.mid}"></td>
                        <td style="font-weight: bold; color: var(--accent-color); font-size: 1.1rem;" id="avg-${stdId}">${avg}</td>
                    </tr>`;
                });
            });
        }

        // حفظ كل الدرجات دفعة واحدة في السحابة
        window.saveAllGrades = async function() {
            try {
                const db = window.db;
                const rows = document.querySelectorAll('#gradesList tr');
                
                for (let row of rows) {
                    const m1Input = row.querySelector('.m1');
                    if (m1Input) {
                        const stdId = m1Input.getAttribute('data-id');
                        const m1 = row.querySelector('.m1').value;
                        const m2 = row.querySelector('.m2').value;
                        const mid = row.querySelector('.mid').value;

                        // حفظ بيانات درجات التلميذ باستخدام المعرف الخاص به (stdId) كمعرف للمستند
                        await setDoc(doc(db, "grades", stdId), {
                            m1: m1,
                            m2: m2,
                            mid: mid,
                            updatedAt: new Date()
                        }, { merge: true });
                    }
                }
                alert('تم حفظ جميع الدرجات سحابياً بنجاح! 🟢');
            } catch (e) {
                alert('حدث خطأ أثناء الحفظ (تأكد من الاتصال أو وضع أوفلاين): ' + e.message);
            }
        };

        initGradesPage();
    </script>
</body>
</html>
