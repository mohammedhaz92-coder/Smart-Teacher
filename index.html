<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الواجهة الرئيسية - منصة بذرة</title>
    
    <!-- ربط التطبيق بالهاتف -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3304/3304567.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --btn-hover: #2980b9;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; height: 100dvh; box-sizing: border-box; overflow: hidden; }
        .dashboard-container { background-color: var(--card-bg); width: 100%; max-width: 1000px; height: 100%; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .page-title { text-align: center; color: var(--primary-color); margin: 0 0 15px 0; font-size: 1.6rem; flex-shrink: 0; }
        
        .info-section { display: flex; flex-direction: row; gap: 15px; background-color: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e9ecef; flex-shrink: 0; }
        .info-row { flex: 1; display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: space-between; align-items: center; background-color: #fff; padding: 8px 15px; border-radius: 8px; border: 1px solid #e9ecef; overflow: hidden; min-width: 0; }
        .info-details { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; color: var(--text-main); flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .info-details i { color: var(--accent-color); font-size: 1.2rem; flex-shrink: 0; text-align: center; }
        .info-label { font-weight: 700; flex-shrink: 0; }
        .info-value { font-weight: 500; color: var(--primary-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
        
        .edit-input { font-family: 'Tajawal', sans-serif; font-size: 1rem; padding: 4px 8px; border: 1px solid var(--accent-color); border-radius: 5px; outline: none; flex-grow: 1; min-width: 50px; box-sizing: border-box; }
        .edit-btn { flex-shrink: 0; margin-right: 10px; background-color: #f39c12; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 0.9rem; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; }
        
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; flex-grow: 1; }
        .nav-btn { background-color: var(--primary-color); color: #ffffff; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none; box-sizing: border-box; text-align: center; width: 100%; height: 100%; }
        .nav-btn i { font-size: 2.2rem; color: var(--accent-color); }
        .nav-btn:hover { background-color: var(--btn-hover); transform: translateY(-3px); }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .dashboard-container { padding: 12px; }
            .page-title { font-size: 1.4rem; margin-bottom: 10px; }
            .info-section { flex-direction: column; gap: 8px; padding: 10px; margin-bottom: 15px; }
            .info-row { width: 100%; padding: 8px 10px; }
            .info-details { font-size: 0.95rem; }
            .edit-btn { padding: 5px 10px; font-size: 0.85rem; margin-right: 5px; }
            .buttons-grid { gap: 8px; }
            .nav-btn { font-size: 0.85rem; border-radius: 10px; padding: 5px; gap: 6px; }
            .nav-btn i { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1 class="page-title"><i class="fa-solid fa-gauge-high"></i> لوحة التحكم الشاملة</h1>
        
        <div class="info-section">
            <div class="info-row">
                <div class="info-details" title="منصة بذرة التعليمية">
                    <i class="fa-solid fa-school"></i><span class="info-label">المدرسة:</span>
                    <span class="info-value" id="school-text">منصة بذرة التعليمية</span>
                </div>
                <button class="edit-btn" id="school-btn" onclick="toggleEdit('school')"><i class="fa-solid fa-pen"></i> <span>تعديل</span></button>
            </div>
            <div class="info-row">
                <div class="info-details" title="الأستاذ محمد حازم">
                    <i class="fa-solid fa-chalkboard-user"></i><span class="info-label">المعلم:</span>
                    <span class="info-value" id="teacher-text">الأستاذ محمد حازم</span>
                </div>
                <button class="edit-btn" id="teacher-btn" onclick="toggleEdit('teacher')"><i class="fa-solid fa-pen"></i> <span>تعديل</span></button>
            </div>
        </div>

        <div class="buttons-grid">
            <a href="info.html" class="nav-btn"><i class="fa-solid fa-id-card"></i> معلوماتي</a>
            <a href="schedule.html" class="nav-btn"><i class="fa-solid fa-calendar-week"></i> جدول الحصص</a>
            <a href="attendance.html" class="nav-btn"><i class="fa-solid fa-user-check"></i> سجل الحضور</a>
            <a href="grades.html" class="nav-btn"><i class="fa-solid fa-star"></i> الدرجات والتقييم</a>
            <a href="students.html" class="nav-btn"><i class="fa-solid fa-users"></i> التلاميذ</a>
            <a href="exams.html" class="nav-btn"><i class="fa-regular fa-clock"></i> الامتحانات</a>
            <a href="classes.html" class="nav-btn"><i class="fa-solid fa-layer-group"></i> الصفوف</a>
            <a href="subjects.html" class="nav-btn"><i class="fa-solid fa-book"></i> إضافة مواد</a>
            <a href="experiences.html" class="nav-btn"><i class="fa-solid fa-medal"></i> سجل الخبرات</a>
        </div>
    </div>

    <script>
        // تسجيل مُشغّل التطبيق (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('تم تثبيت التطبيق بنجاح!'));
        }

        window.onload = function() {
            if(localStorage.getItem('schoolName')) document.getElementById('school-text').innerText = localStorage.getItem('schoolName');
            const infoName = localStorage.getItem('info_name');
            const teacherName = localStorage.getItem('teacherName');
            if(infoName) document.getElementById('teacher-text').innerText = infoName;
            else if (teacherName) document.getElementById('teacher-text').innerText = teacherName;
        };

        function toggleEdit(id) {
            const el = document.getElementById(id+'-text'), btn = document.getElementById(id+'-btn'), icon = btn.querySelector('i'), span = btn.querySelector('span');
            if (el.tagName.toLowerCase() === 'span') {
                const inp = document.createElement('input'); inp.type='text'; inp.value=el.innerText; inp.className='edit-input'; inp.id=id+'-text';
                el.parentNode.replaceChild(inp, el); btn.classList.add('save-btn'); icon.className='fa-solid fa-check'; span.innerText=' حفظ'; inp.focus();
            } else {
                const val = el.value.trim() === '' ? 'غير محدد' : el.value;
                const newSpan = document.createElement('span'); newSpan.className='info-value'; newSpan.id=id+'-text'; newSpan.innerText=val;
                el.parentNode.replaceChild(newSpan, el); btn.classList.remove('save-btn'); icon.className='fa-solid fa-pen'; span.innerText=' تعديل';
                if (id === 'teacher') { localStorage.setItem('teacherName', val); localStorage.setItem('info_name', val); } 
                else { localStorage.setItem('schoolName', val); }
            }
        }
    </script>
</body>
</html>
