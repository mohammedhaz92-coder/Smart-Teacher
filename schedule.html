<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الحصص - إدارة المدرسة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #34495e; --accent-color: #3498db; --bg-color: #f4f7f6; --text-main: #333333; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .page-container { width: 100%; max-width: 1100px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background-color: var(--primary-color); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; margin-bottom: 20px; width: fit-content; }
        .content-card { background-color: #fff; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 20px; box-sizing: border-box; margin-bottom: 20px; overflow-x: auto; }
        .page-title { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 1.8rem; }
        
        .alert-box { background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: 700; font-size: 0.95rem; border: 1px solid #ffeeba; display: none; }

        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th, td { border: 1px solid #e9ecef; padding: 8px; text-align: center; height: 60px; vertical-align: middle; }
        th { background-color: var(--primary-color); color: white; font-size: 1.1rem; }
        td.day-header { background-color: #f8f9fa; font-weight: 700; color: var(--primary-color); font-size: 1.1rem; width: 10%; }
        
        .cell-container { display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; width: 100%; }
        
        .cell-select { 
            width: 100%; 
            border: 1px solid transparent; 
            background: transparent; 
            text-align: center; 
            font-family: 'Tajawal', sans-serif; 
            outline: none; 
            padding: 2px;
            border-radius: 4px;
            cursor: default;
            -webkit-appearance: none; 
            -moz-appearance: none; 
            appearance: none; 
            text-align-last: center;
        }

        .class-select { font-weight: 700; font-size: 1rem; color: var(--primary-color); }
        .subject-select { font-weight: 500; font-size: 0.9rem; color: var(--accent-color); }

        .editing .cell-select { 
            border: 1px solid #dcdde1; 
            background-color: #f8f9fa; 
            cursor: pointer; 
            appearance: auto; 
            text-align-last: left;
        }
        .editing .cell-select:focus { border-color: var(--accent-color); background-color: #e8f4f8; }

        .actions-bar { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 8px; font-family: 'Tajawal', sans-serif; font-size: 1.1rem;}
        .btn-edit { background-color: #f39c12; } .btn-edit:hover { background-color: #d68910; }
        .btn-save { background-color: #27ae60; display: none; } .btn-save:hover { background-color: #219150; }

        /* تصميم الهواتف (تحويل الجدول لبطاقات) */
        @media (max-width: 768px) {
            .content-card { padding: 15px; overflow-x: visible; }
            #scheduleTable { min-width: auto; }
            #scheduleTable thead { display: none; }
            #scheduleTable, #scheduleTable tbody, #scheduleTable tr, #scheduleTable td { display: block; width: 100%; box-sizing: border-box; }
            #scheduleTable tr { margin-bottom: 15px; border-radius: 12px; border: 1px solid #e9ecef; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
            #scheduleTable td { display: flex; justify-content: space-between; align-items: center; border: none; border-bottom: 1px dashed #eee; padding: 12px 15px; }
            #scheduleTable td:last-child { border-bottom: none; }
            #scheduleTable td.day-header { background-color: var(--primary-color); color: white; justify-content: center; font-size: 1.3rem; width: 100%; }
            #scheduleTable td::before { content: attr(data-label); font-weight: bold; color: var(--secondary-color); width: 40%; }
            #scheduleTable td.day-header::before { display: none; }
            
            .cell-container { width: 60%; align-items: flex-end; }
            .cell-select { text-align: left; text-align-last: right; }
            .editing .cell-select { text-align-last: right; padding-right: 25px; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرجوع للرئيسية</a>

        <div class="alert-box" id="alertBox">
            <i class="fa-solid fa-triangle-exclamation"></i> يرجى التأكد من إضافة (صفوف) و (مواد) من القائمة الرئيسية لتتمكن من استخدامها في الجدول!
        </div>

        <div class="content-card">
            <h2 class="page-title"><i class="fa-solid fa-calendar-week"></i> جدول الحصص الأسبوعي</h2>
            <table id="scheduleTable">
                <thead>
                    <tr><th>اليوم</th><th>الأولى</th><th>الثانية</th><th>الثالثة</th><th>الرابعة</th><th>الخامسة</th><th>السادسة</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="actions-bar">
            <button class="btn btn-edit" id="editBtn" onclick="toggleEdit()"><i class="fa-solid fa-pen"></i> تعديل الجدول</button>
            <button class="btn btn-save" id="saveBtn" onclick="saveData()"><i class="fa-solid fa-check"></i> حفظ التغييرات</button>
        </div>
    </div>

    <script>
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
        const daysEn = ['sun', 'mon', 'tue', 'wed', 'thu']; 
        const labels = ['الحصة 1:', 'الحصة 2:', 'الحصة 3:', 'الحصة 4:', 'الحصة 5:', 'الحصة 6:'];

        const savedClasses = JSON.parse(localStorage.getItem('savedClasses')) || [];
        const savedSubjects = JSON.parse(localStorage.getItem('savedSubjects')) || [];

        // إظهار تنبيه في حال عدم وجود بيانات
        if (savedClasses.length === 0 || savedSubjects.length === 0) {
            document.getElementById('alertBox').style.display = 'block';
        }

        let classesOptionsHTML = `<option value="">- الصف -</option>`;
        savedClasses.sort().forEach(c => classesOptionsHTML += `<option value="${c}">${c}</option>`);

        let subjectsOptionsHTML = `<option value="">- المادة -</option>`;
        savedSubjects.forEach(s => subjectsOptionsHTML += `<option value="${s}">${s}</option>`);

        function buildTable() {
            const tbody = document.getElementById('tableBody');
            for (let i = 0; i < days.length; i++) {
                let tr = document.createElement('tr');
                
                let tdDay = document.createElement('td');
                tdDay.innerText = days[i];
                tdDay.className = 'day-header';
                tr.appendChild(tdDay);

                for (let j = 1; j <= 6; j++) {
                    let td = document.createElement('td');
                    td.setAttribute('data-label', labels[j-1]);
                    
                    let divContainer = document.createElement('div');
                    divContainer.className = 'cell-container';

                    let classSelect = document.createElement('select');
                    classSelect.className = 'cell-select class-select';
                    classSelect.id = `cell-${daysEn[i]}-${j}-class`;
                    classSelect.innerHTML = classesOptionsHTML;
                    classSelect.disabled = true;

                    let subjectSelect = document.createElement('select');
                    subjectSelect.className = 'cell-select subject-select';
                    subjectSelect.id = `cell-${daysEn[i]}-${j}-subject`;
                    subjectSelect.innerHTML = subjectsOptionsHTML;
                    subjectSelect.disabled = true;

                    // جلب البيانات المحفوظة
                    if (localStorage.getItem(classSelect.id)) classSelect.value = localStorage.getItem(classSelect.id);
                    if (localStorage.getItem(subjectSelect.id)) subjectSelect.value = localStorage.getItem(subjectSelect.id);

                    divContainer.appendChild(classSelect);
                    divContainer.appendChild(subjectSelect);
                    td.appendChild(divContainer);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }
        
        window.onload = buildTable;

        function toggleEdit() {
            document.getElementById('scheduleTable').classList.add('editing');
            document.querySelectorAll('.cell-select').forEach(i => i.disabled = false);
            document.getElementById('editBtn').style.display = 'none'; 
            document.getElementById('saveBtn').style.display = 'inline-flex';
        }

        function saveData() {
            document.getElementById('scheduleTable').classList.remove('editing');
            document.querySelectorAll('.cell-select').forEach(i => { 
                localStorage.setItem(i.id, i.value); 
                i.disabled = true; 
            });
            document.getElementById('saveBtn').style.display = 'none'; 
            document.getElementById('editBtn').style.display = 'inline-flex';
        }
    </script>
</body>
</html>
