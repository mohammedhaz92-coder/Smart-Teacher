<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التلاميذ - إدارة المدرسة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --success-color: #27ae60;
            --text-main: #333333;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .page-container { width: 100%; max-width: 1000px; }
        
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background-color: var(--primary-color); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; margin-bottom: 20px; width: fit-content; transition: 0.3s; }
        .back-btn:hover { background-color: #1a252f; transform: translateX(5px); }

        .content-card { background-color: var(--card-bg); border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 30px; box-sizing: border-box; margin-bottom: 30px; width: 100%; }
        .page-title { text-align: center; color: var(--primary-color); margin-top: 0; margin-bottom: 25px; font-size: 1.8rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }

        /* نموذج الإضافة والبحث */
        .form-grid { display: grid; grid-template-columns: 2fr 1fr auto; gap: 15px; align-items: end; background-color: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #e9ecef; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: 700; color: var(--secondary-color); font-size: 1.05rem; }
        .input-group input, .input-group select { font-family: 'Tajawal', sans-serif; font-size: 1.05rem; padding: 10px; border: 1px solid #dcdde1; border-radius: 8px; outline: none; width: 100%; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent-color); }
        
        .btn-add { background-color: var(--success-color); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; height: 43px; display: flex; align-items: center; gap: 8px; }
        .btn-add:hover { background-color: #219150; }

        /* الجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e9ecef; padding: 12px; text-align: center; font-size: 1.05rem; }
        th { background-color: var(--primary-color); color: white; font-weight: 700; }
        td { background-color: #fff; vertical-align: middle; }
        .student-name-col { font-weight: 700; color: var(--primary-color); }

        .actions-group { display: flex; gap: 10px; justify-content: center; }
        .btn-card { background-color: var(--accent-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 5px; }
        .btn-card:hover { background-color: #2980b9; }
        .btn-delete { background-color: var(--danger-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background-color: #c0392b; }

        /* ================== تصميم نافذة بطاقة التلميذ (Modal) ================== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; backdrop-filter: blur(4px); }
        .modal-content { background-color: #fff; width: 100%; max-width: 850px; max-height: 90vh; overflow-y: auto; border-radius: 15px; position: relative; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); box-sizing: border-box; }
        
        .close-btn { position: absolute; top: 15px; left: 15px; background: #f1f2f6; border: none; font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--danger-color); transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .close-btn:hover { background: var(--danger-color); color: #fff; }

        .student-header { text-align: center; border-bottom: 2px solid #e9ecef; padding-bottom: 20px; margin-bottom: 20px; }
        .student-header h2 { color: var(--primary-color); margin: 0 0 10px 0; font-size: 2rem; }
        .student-header p { color: var(--secondary-color); font-size: 1.2rem; font-weight: bold; margin: 0 0 15px 0; }
        .absence-badge { background-color: #ffebee; color: #c62828; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; display: inline-block; border: 1px solid #ffcdd2; }

        .section-title { color: var(--secondary-color); font-size: 1.3rem; margin: 25px 0 15px 0; display: flex; align-items: center; gap: 8px; border-right: 4px solid var(--accent-color); padding-right: 10px; }
        
        /* شبكة الكروت للمواد */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .subject-card { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .subject-card h4 { margin: 0 0 15px 0; color: var(--accent-color); border-bottom: 1px dashed #dcdde1; padding-bottom: 8px; font-size: 1.1rem; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; font-weight: 500; align-items: center; }
        .data-row:last-child { margin-bottom: 0; }
        
        /* ألوان التقييم */
        .badge-val { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
        .val-excellent { background-color: #d4edda; color: #155724; }
        .val-vgood { background-color: #d1ecf1; color: #0c5460; }
        .val-good { background-color: #e2e3e5; color: #383d41; }
        .val-average { background-color: #fff3cd; color: #856404; }
        .val-pass { background-color: #f8d7da; color: #721c24; }
        .val-weak { background-color: #dc3545; color: #fff; }
        .val-grade { background-color: #e8f4f8; color: var(--primary-color); font-size: 1.1rem; padding: 2px 8px; }

        .empty-msg { text-align: center; color: #7f8c8d; font-style: italic; background: #f8f9fa; padding: 15px; border-radius: 8px; }

        @media (max-width: 768px) {
            .content-card { padding: 20px 15px; }
            .form-grid { grid-template-columns: 1fr; gap: 10px; }
            .btn-add { width: 100%; justify-content: center; }
            
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; box-sizing: border-box; }
            tr { border: 2px solid #e9ecef; border-radius: 12px; margin-bottom: 15px; background-color: #fff; overflow: hidden; }
            td { border: none; border-bottom: 1px dashed #eee; padding: 12px 15px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
            td:last-child { border-bottom: none; background-color: #f8f9fa; justify-content: center; }
            td::before { content: attr(data-label); font-weight: 700; color: var(--secondary-color); margin-left: 10px; }
            .actions-group { width: 100%; }
            .btn-card { flex-grow: 1; justify-content: center; }

            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرجوع للرئيسية</a>

        <!-- قسم الإضافة -->
        <div class="content-card">
            <h2 class="page-title"><i class="fa-solid fa-user-plus"></i> إضافة تلميذ جديد</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>الاسم الرباعي للتلميذ:</label>
                    <input type="text" id="studentName" placeholder="مثال: أحمد محمد علي حسن">
                </div>
                <div class="input-group">
                    <label>الصف والشعبة:</label>
                    <select id="studentClass"></select>
                </div>
                <button class="btn-add" onclick="addStudent()"><i class="fa-solid fa-plus"></i> إضافة</button>
            </div>
        </div>

        <!-- قسم قائمة التلاميذ -->
        <div class="content-card">
            <h2 class="page-title"><i class="fa-solid fa-users"></i> سجل التلاميذ</h2>
            
            <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div class="input-group">
                    <label>فلترة حسب الصف:</label>
                    <select id="filterClass" onchange="renderTable()">
                        <option value="الكل">عرض جميع الصفوف</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>بحث بالاسم:</label>
                    <input type="text" id="searchInput" placeholder="اكتب اسم التلميذ للبحث..." onkeyup="renderTable()">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">ت</th>
                        <th style="width: 45%;">اسم التلميذ</th>
                        <th style="width: 20%;">الصف والشعبة</th>
                        <th style="width: 25%;">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة بطاقة التلميذ (Modal) -->
    <div id="studentModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="student-header">
                <h2 id="modalName">اسم التلميذ</h2>
                <p id="modalClass"><i class="fa-solid fa-chalkboard-user"></i> الصف والشعبة</p>
                <div class="absence-badge"><i class="fa-solid fa-user-xmark"></i> عدد أيام الغياب: <span id="modalAbsence">0</span> يوم</div>
            </div>

            <h3 class="section-title"><i class="fa-solid fa-star"></i> سجل الدرجات</h3>
            <div id="modalGradesArea"></div>

            <h3 class="section-title"><i class="fa-solid fa-ranking-star"></i> سجل التقييم الوصفي</h3>
            <div id="modalEvalsArea"></div>

        </div>
    </div>

    <script>
        const savedClasses = JSON.parse(localStorage.getItem('savedClasses')) || [];
        const savedSubjects = JSON.parse(localStorage.getItem('savedSubjects')) || [];
        let studentsData = JSON.parse(localStorage.getItem('studentsData')) || [];
        
        // جلب البيانات الأخرى لإظهارها في البطاقة
        const attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || {};
        const gradesData = JSON.parse(localStorage.getItem('studentGradesData')) || {};
        const evalData = JSON.parse(localStorage.getItem('evaluationsData')) || {};

        window.onload = function() {
            let classOptions = '<option value="">- اختر الصف -</option>';
            let filterOptions = '<option value="الكل">عرض جميع الصفوف</option>';
            
            savedClasses.sort().forEach(c => {
                classOptions += `<option value="${c}">${c}</option>`;
                filterOptions += `<option value="${c}">${c}</option>`;
            });
            
            document.getElementById('studentClass').innerHTML = classOptions;
            document.getElementById('filterClass').innerHTML = filterOptions;

            renderTable();
        };

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const cls = document.getElementById('studentClass').value;

            if (!name || !cls) {
                alert('يرجى كتابة اسم التلميذ واختيار الصف!');
                return;
            }

            const newStudent = { id: Date.now(), name: name, class: cls };
            studentsData.push(newStudent);
            localStorage.setItem('studentsData', JSON.stringify(studentsData));
            
            document.getElementById('studentName').value = '';
            renderTable();
        }

        function deleteStudent(id) {
            if(confirm('هل أنت متأكد من حذف هذا التلميذ؟\nسيتم مسح اسمه من هذا السجل فقط.')) {
                studentsData = studentsData.filter(s => s.id !== id);
                localStorage.setItem('studentsData', JSON.stringify(studentsData));
                renderTable();
            }
        }

        function renderTable() {
            const filterCls = document.getElementById('filterClass').value;
            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('studentsBody');
            
            tbody.innerHTML = '';
            
            let filtered = studentsData;
            if (filterCls !== 'الكل') filtered = filtered.filter(s => s.class === filterCls);
            if (searchTxt) filtered = filtered.filter(s => s.name.toLowerCase().includes(searchTxt));

            filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">لا يوجد تلاميذ مطابقين للبحث.</td></tr>`;
                return;
            }

            filtered.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="التسلسل:"><b>${index + 1}</b></td>
                    <td data-label="اسم التلميذ:" class="student-name-col">${student.name}</td>
                    <td data-label="الصف:">${student.class}</td>
                    <td data-label="إجراء:">
                        <div class="actions-group">
                            <button class="btn-card" onclick="openStudentCard(${student.id})"><i class="fa-solid fa-address-card"></i> البطاقة</button>
                            <button class="btn-delete" onclick="deleteStudent(${student.id})" title="حذف التلميذ"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ==================== برمجة بطاقة التلميذ الذكية ====================

        function getEvalClass(val) {
            if(val === 'ممتاز') return 'val-excellent';
            if(val === 'جيد جدا') return 'val-vgood';
            if(val === 'جيد') return 'val-good';
            if(val === 'متوسط') return 'val-average';
            if(val === 'مقبول') return 'val-pass';
            if(val === 'ضعيف') return 'val-weak';
            return '';
        }

        function openStudentCard(studentId) {
            const student = studentsData.find(s => s.id === studentId);
            if (!student) return;

            document.getElementById('modalName').innerText = student.name;
            document.getElementById('modalClass').innerHTML = `<i class="fa-solid fa-chalkboard-user"></i> ${student.class}`;

            // 1. حساب عدد الغيابات
            let absCount = 0;
            for (let key in attendanceData) {
                // key format: YYYY-MM-DD_studentId
                if (key.endsWith(`_${studentId}`) && attendanceData[key] === 'absent') {
                    absCount++;
                }
            }
            document.getElementById('modalAbsence').innerText = absCount;

            // 2. تجميع الدرجات
            let gradesHtml = '<div class="card-grid">';
            let hasGrades = false;
            
            savedSubjects.forEach(subject => {
                let subjectGrades = [];
                // البحث في الدرجات
                for (let key in gradesData) {
                    // key format: studentId_month_subject
                    if (key.startsWith(`${studentId}_`) && key.endsWith(`_${subject}`)) {
                        let month = key.split('_')[1];
                        subjectGrades.push(`<div class="data-row"><span>${month}:</span> <span class="badge-val val-grade">${gradesData[key]}</span></div>`);
                        hasGrades = true;
                    }
                }
                if (subjectGrades.length > 0) {
                    gradesHtml += `
                        <div class="subject-card">
                            <h4><i class="fa-solid fa-book"></i> ${subject}</h4>
                            ${subjectGrades.join('')}
                        </div>`;
                }
            });
            gradesHtml += '</div>';
            if (!hasGrades) gradesHtml = '<div class="empty-msg">لم يتم رصد أي درجات لهذا التلميذ حتى الآن.</div>';
            document.getElementById('modalGradesArea').innerHTML = gradesHtml;

            // 3. تجميع التقييمات الوصفية
            let evalHtml = '<div class="card-grid">';
            let hasEvals = false;
            
            savedSubjects.forEach(subject => {
                let subjectEvals = [];
                for (let key in evalData) {
                    // key format: studentId_month_subject_type
                    const parts = key.split('_');
                    if (parts[0] == studentId && parts[2] === subject) {
                        let month = parts[1];
                        let type = parts[3];
                        let val = evalData[key];
                        
                        // تعريب النوع
                        let typeAr = type;
                        if (type === 'participation') typeAr = 'مشاركة يومية';
                        else if (type === 'notebook') typeAr = 'تقييم دفتر';
                        else if (type.startsWith('week')) typeAr = type.replace('week', 'الأسبوع ');

                        subjectEvals.push(`<div class="data-row"><span>${month} (${typeAr}):</span> <span class="badge-val ${getEvalClass(val)}">${val}</span></div>`);
                        hasEvals = true;
                    }
                }
                if (subjectEvals.length > 0) {
                    evalHtml += `
                        <div class="subject-card">
                            <h4><i class="fa-solid fa-ranking-star"></i> ${subject}</h4>
                            ${subjectEvals.join('')}
                        </div>`;
                }
            });
            evalHtml += '</div>';
            if (!hasEvals) evalHtml = '<div class="empty-msg">لم يتم رصد أي تقييم وصفي لهذا التلميذ حتى الآن.</div>';
            document.getElementById('modalEvalsArea').innerHTML = evalHtml;

            // إظهار النافذة
            document.getElementById('studentModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('studentModal').style.display = 'none';
        }
    </script>
</body>
</html>
