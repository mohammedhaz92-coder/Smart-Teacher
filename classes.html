<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة صفوف - إدارة المدرسة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --btn-hover: #2980b9;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --danger-color: #e74c3c;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .page-container {
            width: 100%;
            max-width: 800px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .back-btn:hover {
            background-color: var(--btn-hover);
            transform: translateX(5px);
        }

        .content-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 30px;
            box-sizing: border-box;
            margin-bottom: 20px;
            width: 100%;
        }

        .page-title {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        /* تصميم قسم الإضافة */
        .add-section {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
        }

        .select-group {
            flex: 1; /* تأخذ مساحة متساوية */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group label {
            font-weight: 700;
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        .styled-select {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: #fff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .styled-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 25px;
            height: 48px;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background-color: var(--btn-hover);
        }

        /* تصميم قائمة الصفوف المضافة */
        .section-subtitle {
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .classes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .class-card {
            background-color: #fff;
            border: 1px solid #e9ecef;
            border-left: 4px solid var(--accent-color); /* خط زينة جانبي */
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        .class-card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        .class-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .class-name i {
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
            border-radius: 5px;
        }

        .delete-btn:hover {
            background-color: #fdeaea;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            border: 1px dashed #dcdde1;
        }

        /* للهواتف المحمولة */
        @media (max-width: 650px) {
            .add-section {
                flex-direction: column;
                align-items: stretch;
            }
            .add-btn {
                justify-content: center;
                margin-top: 5px;
            }
            .classes-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
            الرجوع للرئيسية
        </a>

        <div class="content-card">
            <h2 class="page-title"><i class="fa-solid fa-layer-group"></i> إدارة الصفوف والشُعب</h2>
            
            <!-- قسم الإضافة -->
            <div class="add-section">
                <div class="select-group">
                    <label>اختر الصف:</label>
                    <select id="gradeSelect" class="styled-select">
                        <option value="الصف الأول">الصف الأول</option>
                        <option value="الصف الثاني">الصف الثاني</option>
                        <option value="الصف الثالث">الصف الثالث</option>
                        <option value="الصف الرابع">الصف الرابع</option>
                        <option value="الصف الخامس">الصف الخامس</option>
                        <option value="الصف السادس">الصف السادس</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>اختر الشعبة:</label>
                    <select id="sectionSelect" class="styled-select">
                        <option value="أ">أ</option>
                        <option value="ب">ب</option>
                        <option value="ج">ج</option>
                        <option value="د">د</option>
                        <option value="هـ">هـ</option>
                        <option value="و">و</option>
                        <option value="ز">ز</option>
                    </select>
                </div>

                <button class="add-btn" onclick="addClass()">
                    <i class="fa-solid fa-plus"></i> إضافة
                </button>
            </div>

            <!-- عرض الصفوف المضافة -->
            <h3 class="section-subtitle">الصفوف المضافة حالياً:</h3>
            <div class="classes-list" id="classesListContainer">
                <!-- سيتم عرض الصفوف هنا بواسطة الجافاسكربت -->
            </div>
        </div>
    </div>

    <script>
        // قراءة الصفوف المحفوظة مسبقاً من المتصفح
        let savedClasses = JSON.parse(localStorage.getItem('savedClasses')) || [];

        // دالة لعرض الصفوف
        function renderClasses() {
            const container = document.getElementById('classesListContainer');
            container.innerHTML = '';

            if (savedClasses.length === 0) {
                container.innerHTML = `<div class="empty-msg">لم تقم بإضافة أي صفوف بعد.</div>`;
                return;
            }

            // ترتيب المصفوفة أبجدياً لتبدو منظمة
            savedClasses.sort();

            savedClasses.forEach((className, index) => {
                const card = document.createElement('div');
                card.className = 'class-card';
                card.innerHTML = `
                    <div class="class-name">
                        <i class="fa-solid fa-users-rectangle"></i>
                        ${className}
                    </div>
                    <button class="delete-btn" onclick="deleteClass(${index})" title="حذف الصف">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // دالة إضافة صف جديد
        function addClass() {
            const grade = document.getElementById('gradeSelect').value;
            const section = document.getElementById('sectionSelect').value;
            
            // دمج الصف والشعبة معاً
            const fullClassName = `${grade} - ${section}`;

            // التحقق مما إذا كان الصف مضافاً مسبقاً لمنع التكرار
            if (savedClasses.includes(fullClassName)) {
                alert('هذا الصف مضاف مسبقاً!');
                return;
            }

            // إضافة الصف للمصفوفة وحفظه
            savedClasses.push(fullClassName);
            localStorage.setItem('savedClasses', JSON.stringify(savedClasses));
            
            renderClasses();
        }

        // دالة الحذف
        function deleteClass(index) {
            // حذف الصف وتحديث التخزين
            savedClasses.splice(index, 1);
            localStorage.setItem('savedClasses', JSON.stringify(savedClasses));
            renderClasses();
        }

        // تشغيل دالة العرض عند فتح الصفحة
        window.onload = renderClasses;
    </script>
</body>
</html>
